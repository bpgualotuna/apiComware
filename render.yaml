services:
  - type: web
    name: comware-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: comware
      - key: DB_SSL
        value: true
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /api/health
